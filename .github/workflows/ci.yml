name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
          cache: maven

      # Testcontainers usa o Docker que já vem no runner.
      - name: Testes
        run: ./mvnw -B verify
